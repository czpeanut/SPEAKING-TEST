<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>會說話的人 - AI 問答虛擬人</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark">◆</span>
      <span class="topbar-title">會說話的人</span>
      <span class="topbar-sub">AI QA AVATAR</span>
    </div>
    <div class="topbar-status" id="topbarStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">連線中</span>
    </div>
  </header>

  <main class="app">
    <section class="panel avatar-panel">
      <div class="panel-head">
        <span class="eyebrow">AVATAR</span>
        <h2>虛擬人</h2>
      </div>
      <div class="avatar-stage" id="avatarStage">
        <video id="avatarVideo" class="avatar-video" autoplay playsinline muted></video>
        <audio id="avatarAudio" autoplay></audio>
        <div class="connect-overlay" id="connectOverlay">
          <div class="spinner"></div>
          <p id="connectStatus">連線中…</p>
        </div>
      </div>
      <div class="control-row">
        <label for="rateRange">語速<span class="control-val" id="rateVal">1.0</span></label>
        <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" />
      </div>
      <div class="control-row">
        <label for="volumeRange">音量<span class="control-val" id="volumeVal">1.0</span></label>
        <input type="range" id="volumeRange" min="0" max="1" step="0.1" value="1" />
      </div>
    </section>

    <section class="panel qa-panel">
      <div class="panel-head">
        <span class="eyebrow">ASK A QUESTION</span>
        <h2>提問</h2>
      </div>

      <form id="askForm" class="ask-form">
        <textarea
          id="questionInput"
          rows="3"
          maxlength="2000"
          placeholder="輸入你的問題，例如：質數是什麼？"
        ></textarea>
        <button type="submit" id="askBtn" class="btn btn-primary" disabled>送出問題</button>
      </form>

      <p class="hint" id="hint">正在連線到虛擬人服務…</p>

      <div class="answer-box" id="answerBox" hidden>
        <span class="eyebrow">ANSWER</span>
        <p id="answerText"></p>
      </div>

      <div class="history-head">
        <span class="eyebrow">RECENT · 最近對話</span>
      </div>
      <ol class="history-list" id="historyList">
        <li class="history-empty" id="historyEmpty">還沒有紀錄</li>
      </ol>
    </section>
  </main>

  <script type="module" src="app.bundle.js"></script>
</body>
</html>
