<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>會說話的人 - Talking Avatar</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🗣️ 會說話的人</h1>
      <p class="subtitle">輸入文字，讓他即時開口念出來</p>
    </header>

    <main class="stage">
      <section class="avatar-wrap">
        <div class="avatar-stage" id="avatarStage">
          <video id="avatarVideo" class="avatar-video" autoplay playsinline muted></video>
          <audio id="avatarAudio" autoplay></audio>

          <div class="connect-overlay" id="connectOverlay">
            <div class="spinner"></div>
            <p id="connectStatus">連線中…</p>
          </div>

          <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">待機中</span>
          </div>
        </div>
      </section>

      <section class="panel">
        <label for="textInput" class="panel-label">要說的話</label>
        <textarea id="textInput" rows="6" maxlength="800" placeholder="在這裡輸入文字，例如：你好，我是你的虛擬助手！">你好，我是你的虛擬助手，很高興認識你！</textarea>

        <div class="controls-row">
          <div class="control">
            <label for="voiceSelect">語音</label>
            <select id="voiceSelect">
              <option value="">載入語音清單中…</option>
            </select>
          </div>
        </div>

        <div class="controls-row sliders">
          <div class="control">
            <label for="rateRange">語速 <span id="rateVal">1.0</span></label>
            <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" />
          </div>
          <div class="control">
            <label for="volumeRange">音量 <span id="volumeVal">1.0</span></label>
            <input type="range" id="volumeRange" min="0" max="1" step="0.1" value="1" />
          </div>
        </div>

        <div class="buttons-row">
          <button id="speakBtn" class="btn btn-primary" disabled>▶ 開始說話</button>
          <button id="stopBtn" class="btn btn-secondary" disabled>■ 停止</button>
        </div>

        <p class="hint" id="hint">正在連線到虛擬人服務…</p>
      </section>
    </main>
  </div>

  <script type="module" src="app.bundle.js"></script>
</body>
</html>
